name: Run Gurbani AI

on:
  workflow_dispatch:
  
permissions:
  contents: read

concurrency:
  group: gurbani-ai
  cancel-in-progress: false

jobs:
  create-video:
    name: Set up Palki Sahib Video Creator
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      HLS_SECRET: ${{ secrets.HLS_SECRET }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE2_PROJECT_ID: ${{ secrets.FIREBASE2_PROJECT_ID }}
      FIREBASE2_CLIENT_EMAIL: ${{ secrets.FIREBASE2_CLIENT_EMAIL }}
      FIREBASE2_PRIVATE_KEY: ${{ secrets.FIREBASE2_PRIVATE_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      RUN_COMPLETION_SECRET: ${{ secrets.RUN_COMPLETION_SECRET }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_PROFILE_ID: ${{ secrets.INSTAGRAM_PROFILE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Firefox and restore profile
        id: firefox
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\setup-firefox.ps1" `
            -Workspace "$env:GITHUB_WORKSPACE\Firefox-Setup"

      - name: Verify Google sign-in via YouTube screenshot
        shell: pwsh
        env:
          FIREFOX_EXECUTABLE: ${{ steps.firefox.outputs.firefox_executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\verify-firefox.ps1" `
            -FirefoxExecutable "$env:FIREFOX_EXECUTABLE" `
            -ScreenshotDirectory "$env:GITHUB_WORKSPACE\Firefox-Setup\verification-screenshots"

      - name: Validate Gurbani AI secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YT_API_KEY)) {
            throw "Missing GitHub Actions secret: YT_API_KEY"
          }
          if (
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY_1) -and
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY_2) -and
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY_3) -and
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY_4)
          ) {
            throw "Add at least one free Gemini key: GEMINI_API_KEY_1 (and optionally _2, _3, _4)."
          }
          foreach ($secretName in @(
            "HLS_SECRET",
            "FIREBASE_PROJECT_ID",
            "FIREBASE_CLIENT_EMAIL",
            "FIREBASE_PRIVATE_KEY",
            "FIREBASE2_PROJECT_ID",
            "FIREBASE2_CLIENT_EMAIL",
            "FIREBASE2_PRIVATE_KEY",
            "YOUTUBE_CLIENT_ID",
            "YOUTUBE_CLIENT_SECRET",
            "YOUTUBE_REFRESH_TOKEN",
            "RUN_COMPLETION_SECRET"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$secretName").Value)) {
              throw "Missing GitHub Actions secret: $secretName"
            }
          }
          # Social publishing is best-effort: warn (do not fail) if its secrets
          # are absent so the core pipeline can still run.
          foreach ($secretName in @(
            "FACEBOOK_ACCESS_TOKEN",
            "FACEBOOK_PAGE_ID",
            "INSTAGRAM_PROFILE_ID"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$secretName").Value)) {
              Write-Warning "Optional social secret not set: $secretName (Facebook/Instagram publishing will be skipped)"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "google-genai>=1.0,<2" "pillow>=10,<13" "pydantic>=2.7,<3" "requests>=2.32,<3" "yt-dlp>=2026.7.4"
          python -m pip check

      - name: Validate Python source
        run: python -m compileall -q main.py Scripts

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Verify runner tools
        shell: pwsh
        run: |
          python --version
          yt-dlp --version
          node --version

      - name: Install Node dependencies
        run: npm install puppeteer firebase-admin googleapis

      - name: Run Gurbani AI pipeline
        run: python main.py

      - name: Notify admin app of failed run
        if: ${{ failure() }}
        run: node Publish-Scripts/notify-admin-failure.js

      - name: Upload Firefox verification screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: firefox-verification-screenshot
          path: Firefox-Setup/verification-screenshots/*.jpg
          if-no-files-found: error
          retention-days: 1

  # Fan out the daily Palki Sahib push ONLY after the video is built + published.
  # This replaces the old 4:00 AM blind timer in the Cloudflare Worker: users are
  # notified exactly when fresh Palki Sahib content is actually live.
  # Both the Hukamnama Sahib app and the Gurbani app have a "palki" job.
  trigger-palki-notifications:
    name: Trigger Palki Sahib notification (Hukamnama Sahib + Gurbani apps)
    needs: create-video          # runs ONLY if the build+publish job fully succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch "palki" job to Apps-Notifications
        env:
          # Fine-grained PAT — repo access: Apps-Notifications ONLY, permission: Actions = Read and write
          NOTIFY_DISPATCH_TOKEN: ${{ secrets.NOTIFY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="BHG-App-Studios"
          REPO="Apps-Notifications"
          REF="main"   # must match the Apps-Notifications default branch
          WORKFLOWS="hukamnama-sahib-app.yml gurbani-app.yml"

          overall=0
          for wf in $WORKFLOWS; do
            ok=0
            for attempt in 1 2 3; do
              echo "→ Dispatching palki to $wf (attempt $attempt)"
              code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $NOTIFY_DISPATCH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$wf/dispatches" \
                -d "{\"ref\":\"$REF\",\"inputs\":{\"job\":\"palki\"}}") || code="000"
              if [ "$code" = "204" ]; then
                echo "  ✅ $wf dispatched (HTTP 204)"
                ok=1
                break
              fi
              echo "  ⚠️  $wf returned HTTP $code: $(cat /tmp/resp.txt 2>/dev/null || true)"
              [ "$attempt" -lt 3 ] && sleep 5 || true
            done
            if [ "$ok" -ne 1 ]; then
              echo "  ❌ Giving up on $wf after 3 attempts"
              overall=1
            fi
          done

          if [ "$overall" -ne 0 ]; then
            echo "❌ Palki Sahib dispatch failed."
            exit 1
          fi
          echo "✅ Palki Sahib notification dispatched."
