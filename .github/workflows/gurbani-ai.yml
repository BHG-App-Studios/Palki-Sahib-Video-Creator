name: Run Gurbani AI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: gurbani-ai
  cancel-in-progress: false

jobs:
  create-video:
    name: Set up Firefox and run Gurbani AI
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Firefox and restore profile
        id: firefox
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\setup-firefox.ps1" `
            -Workspace "$env:GITHUB_WORKSPACE\Firefox-Setup"

      - name: Verify Google sign-in via YouTube screenshot
        shell: pwsh
        env:
          FIREFOX_EXECUTABLE: ${{ steps.firefox.outputs.firefox_executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\verify-firefox.ps1" `
            -FirefoxExecutable "$env:FIREFOX_EXECUTABLE" `
            -ScreenshotDirectory "$env:GITHUB_WORKSPACE\Firefox-Setup\verification-screenshots"

      - name: Validate Gurbani AI secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YT_API_KEY)) {
            throw "Missing GitHub Actions secret: YT_API_KEY"
          }
          if (
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY) -and
            [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY_PAID)
          ) {
            throw "Add GEMINI_API_KEY or GEMINI_API_KEY_PAID as a GitHub Actions secret."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade --requirement requirements.txt
          python -m pip check

      - name: Validate Python source
        run: python -m compileall -q main.py Scripts

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Verify runner tools
        shell: pwsh
        run: |
          python --version
          yt-dlp --version
          node --version

      - name: Run Gurbani AI pipeline
        run: python main.py

      - name: Upload final video
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: gurbani-ai-final-video
          path: Today-Short/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload pipeline diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gurbani-ai-diagnostics
          path: |
            AI-Response/*.json
            Extracted-Frames/*.png
            Firefox-Setup/verification-screenshots/*.jpg
          if-no-files-found: ignore
          retention-days: 7
